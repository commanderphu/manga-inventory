name: manga_flutter_app
description: Flutter app for Manga Inventory Management
publish_to: 'none'
version: 1.1.1+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # HTTP Client
  http: ^1.1.2

  # JSON Serialization
  json_annotation: ^4.8.1

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.0

  # Scanner & Image
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.19.0
  flutter_secure_storage: ^9.0.0

  # Offline / Local DB
  sqflite: ^2.3.2
  path: ^1.9.0
  connectivity_plus: ^6.0.3

  # Push Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#081120"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  background_color_ios: "#081120"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#081120"
    theme_color: "#081120"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
