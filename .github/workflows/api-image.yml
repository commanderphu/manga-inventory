name: API-Image bauen

# Baut das API-Image und legt es in der GitHub Container Registry ab.
# Der DMZ-Host holt es sich von dort selbst ab (docker compose pull) — es gibt
# bewusst KEINEN Deploy-Schritt, der von aussen auf den Server zugreift.
# Damit braucht der Server kein Quellcode-Checkout mehr und kann nicht mehr
# vom Repo abweichen.

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-image.yml'
  workflow_dispatch:

# Zwei schnell aufeinanderfolgende Pushes: der aeltere Lauf wird abgebrochen,
# damit nicht ein veraltetes Image als letztes auf :latest landet.
concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/manga-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags festlegen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # :latest fuer den laufenden Betrieb, :sha-<kurz> als Ankerpunkt zum
          # Zurueckrollen. Ohne den zweiten Tag gibt es keinen Weg zurueck.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: ./api
          # Nur amd64 — der DMZ-Host laeuft auf x86. Multi-Arch waere Aufwand
          # ohne Nutzen, solange es kein ARM-Ziel gibt.
          platforms: linux/amd64
          # Erst laden, nicht pushen: das Image wird unten getestet, bevor es
          # veroeffentlicht wird.
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Startet das Image ueberhaupt?
        run: |
          # /health braucht weder Datenbank noch API-Key — deshalb laesst sich
          # der Start ohne Testumgebung pruefen. Faengt kaputte Builds ab, bevor
          # :latest darauf zeigt und die DMZ sie sich zieht.
          docker run -d --name smoke -p 3000:3000 -e NODE_ENV=production "$IMAGE:latest"
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then
              echo; echo "Health-Check ok nach ${i}s"
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "Container antwortet nach 20s nicht auf /health:"
          docker logs smoke
          docker rm -f smoke >/dev/null
          exit 1

      - name: Image veroeffentlichen
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done

      - name: Zusammenfassung
        run: |
          {
            echo "### Image veroeffentlicht"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Auf dem DMZ-Host einspielen:"
            echo '```'
            echo "cd /srv/vacation && docker compose pull manga_api && docker compose up -d manga_api"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
