name: API bauen und deployen

# Baut das API-Image, legt es in der GitHub Container Registry ab und spielt es
# auf dem DMZ-Host ein (/srv/vacation, Service manga_api).
#
# Der Deploy-Key darf auf dem Host genau einen Befehl ausführen
# (scripts/deploy/manga-deploy.sh als Forced Command) — keine Shell, kein
# Forwarding. Er liegt im Environment "production", das nur für main
# freigegeben ist; Fork-PRs kommen an das Secret nicht heran.
# Einrichtung: scripts/deploy/setup-dmz.sh

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-image.yml'
  workflow_dispatch:

# Zwei schnell aufeinanderfolgende Pushes: der aeltere Lauf wird abgebrochen,
# damit nicht ein veraltetes Image als letztes auf :latest landet.
concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/manga-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags festlegen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # :latest fuer den laufenden Betrieb, :sha-<kurz> als Ankerpunkt zum
          # Zurueckrollen. Ohne den zweiten Tag gibt es keinen Weg zurueck.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: ./api
          # Nur amd64 — der DMZ-Host laeuft auf x86. Multi-Arch waere Aufwand
          # ohne Nutzen, solange es kein ARM-Ziel gibt.
          platforms: linux/amd64
          # Erst laden, nicht pushen: das Image wird unten getestet, bevor es
          # veroeffentlicht wird.
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          # Enthält org.opencontainers.image.revision — daran prüft der
          # Deploy-Job, ob auf dem Host wirklich dieser Commit läuft.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Startet das Image ueberhaupt?
        run: |
          # /health braucht weder Datenbank noch API-Key — deshalb laesst sich
          # der Start ohne Testumgebung pruefen. Faengt kaputte Builds ab, bevor
          # :latest darauf zeigt und die DMZ sie sich zieht.
          docker run -d --name smoke -p 3000:3000 -e NODE_ENV=production "$IMAGE:latest"
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then
              echo; echo "Health-Check ok nach ${i}s"
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "Container antwortet nach 20s nicht auf /health:"
          docker logs smoke
          docker rm -f smoke >/dev/null
          exit 1

      - name: Image veroeffentlichen
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done

      - name: Zusammenfassung
        run: |
          {
            echo "### Image veroeffentlicht"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://manga-api.phudevelopement.xyz/health
    # Ein laufender Deploy wird nie abgebrochen — sonst kann der Container
    # mitten im Neustart hängen bleiben. Der nächste wartet einfach.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: SSH-Zugang vorbereiten
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DMZ_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host-Key fest hinterlegt statt ssh-keyscan im Lauf — sonst wäre
          # ein untergeschobener Host nicht von dmz zu unterscheiden.
          echo "${{ secrets.DMZ_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Auf dmz einspielen
        id: deploy
        run: |
          # Der Befehl ist serverseitig festgelegt; es wird nichts mitgeschickt.
          output=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "manga-deploy@${{ secrets.DMZ_SSH_HOST }}")
          echo "$output"
          echo "$output" | grep '^revision=' >> "$GITHUB_OUTPUT"

      - name: Läuft der richtige Commit?
        run: |
          if [ "${{ steps.deploy.outputs.revision }}" != "$GITHUB_SHA" ]; then
            echo "Auf dmz läuft ${{ steps.deploy.outputs.revision }}, erwartet $GITHUB_SHA"
            exit 1
          fi

      - name: Von aussen erreichbar?
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://manga-api.phudevelopement.xyz/health

      - name: Zusammenfassung
        run: |
          {
            echo "### Deployed auf dmz"
            echo
            echo "Commit \`${GITHUB_SHA::7}\` läuft als \`vacation_manga_api\`."
            echo
            echo "Zurückrollen: in /srv/vacation das Image auf \`ghcr.io/${{ github.repository_owner }}/manga-api:sha-<vorher>\` setzen und \`docker compose up -d manga_api\`."
          } >> "$GITHUB_STEP_SUMMARY"
