<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Hauptgradient Hintergrund -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a0533"/>
      <stop offset="45%"  stop-color="#4a1270"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <!-- Leuchtender Akzent -->
    <radialGradient id="glow" cx="38%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#c026d3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c026d3" stop-opacity="0"/>
    </radialGradient>
    <!-- Buch-Schatten -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <!-- Leuchtfilter Titel -->
    <filter id="textglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip für Bücher -->
    <clipPath id="bookClip">
      <rect x="580" y="60" width="420" height="440"/>
    </clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- Subtile Raster-Linien für Tiefe -->
  <g opacity="0.06" stroke="#e879f9" stroke-width="1">
    <line x1="0" y1="100" x2="1024" y2="100"/>
    <line x1="0" y1="200" x2="1024" y2="200"/>
    <line x1="0" y1="300" x2="1024" y2="300"/>
    <line x1="0" y1="400" x2="1024" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
  </g>

  <!-- Dekorative Kreise (Hintergrund) -->
  <circle cx="900" cy="80"  r="120" fill="none" stroke="#f0abfc" stroke-width="1" opacity="0.12"/>
  <circle cx="900" cy="80"  r="80"  fill="none" stroke="#f0abfc" stroke-width="1" opacity="0.10"/>
  <circle cx="150" cy="420" r="150" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.10"/>

  <!-- ═══ BÜCHER-REGAL (rechte Seite) ═══ -->
  <g clip-path="url(#bookClip)" filter="url(#shadow)">

    <!-- Buch 1 — breit, dunkelrot -->
    <rect x="600" y="100" width="52" height="310" rx="3" fill="#7f1d1d"/>
    <rect x="600" y="100" width="8"  height="310" rx="2" fill="#991b1b"/>
    <text x="626" y="275" font-family="serif" font-size="13" fill="#fca5a5" text-anchor="middle"
          transform="rotate(90, 626, 275)" opacity="0.9">BLEACH</text>
    <rect x="600" y="395" width="52" height="15" rx="2" fill="#b91c1c" opacity="0.8"/>

    <!-- Buch 2 — schmal, navy -->
    <rect x="658" y="130" width="38" height="280" rx="3" fill="#1e3a5f"/>
    <rect x="658" y="130" width="7"  height="280" rx="2" fill="#1d4ed8"/>
    <text x="677" y="285" font-family="serif" font-size="11" fill="#93c5fd" text-anchor="middle"
          transform="rotate(90, 677, 285)" opacity="0.9">NARUTO</text>

    <!-- Buch 3 — mittel, grün -->
    <rect x="702" y="90" width="45" height="320" rx="3" fill="#14532d"/>
    <rect x="702" y="90" width="7"  height="320" rx="2" fill="#16a34a"/>
    <text x="724" y="265" font-family="serif" font-size="12" fill="#86efac" text-anchor="middle"
          transform="rotate(90, 724, 265)" opacity="0.9">ONE PIECE</text>
    <rect x="702" y="390" width="45" height="20" rx="2" fill="#15803d" opacity="0.7"/>

    <!-- Buch 4 — schmal, orange -->
    <rect x="753" y="145" width="35" height="265" rx="3" fill="#7c2d12"/>
    <rect x="753" y="145" width="6"  height="265" rx="2" fill="#ea580c"/>
    <text x="770" y="290" font-family="serif" font-size="10" fill="#fdba74" text-anchor="middle"
          transform="rotate(90, 770, 290)" opacity="0.9">DRAGON BALL</text>

    <!-- Buch 5 — breit, lila (hervorgehoben) -->
    <rect x="794" y="75" width="58" height="340" rx="3" fill="#4c1d95"/>
    <rect x="794" y="75" width="9"  height="340" rx="2" fill="#7c3aed"/>
    <rect x="803" y="75" width="1"  height="340" fill="#a78bfa" opacity="0.3"/>
    <text x="823" y="260" font-family="serif" font-size="14" fill="#c4b5fd" text-anchor="middle"
          transform="rotate(90, 823, 260)" opacity="0.95">DEMON SLAYER</text>
    <rect x="794" y="395" width="58" height="20" rx="2" fill="#6d28d9" opacity="0.8"/>

    <!-- Buch 6 — mittel, pink -->
    <rect x="858" y="115" width="42" height="295" rx="3" fill="#831843"/>
    <rect x="858" y="115" width="7"  height="295" rx="2" fill="#db2777"/>
    <text x="879" y="278" font-family="serif" font-size="11" fill="#fbcfe8" text-anchor="middle"
          transform="rotate(90, 879, 278)" opacity="0.9">ATTACK ON TITAN</text>

    <!-- Buch 7 — schmal, teal -->
    <rect x="906" y="155" width="32" height="255" rx="3" fill="#134e4a"/>
    <rect x="906" y="155" width="6"  height="255" rx="2" fill="#0d9488"/>
    <text x="922" y="295" font-family="serif" font-size="10" fill="#99f6e4" text-anchor="middle"
          transform="rotate(90, 922, 295)" opacity="0.9">MY HERO ACADEMIA</text>

    <!-- Buch 8 — breit, gold -->
    <rect x="944" y="88" width="50" height="327" rx="3" fill="#713f12"/>
    <rect x="944" y="88" width="8"  height="327" rx="2" fill="#d97706"/>
    <text x="969" y="265" font-family="serif" font-size="13" fill="#fde68a" text-anchor="middle"
          transform="rotate(90, 969, 265)" opacity="0.9">FULLMETAL</text>
    <rect x="944" y="395" width="50" height="20" rx="2" fill="#b45309" opacity="0.7"/>

    <!-- Regalboard unten -->
    <rect x="590" y="408" width="440" height="16" rx="3" fill="#2d1554" opacity="0.9"/>
    <rect x="590" y="420" width="440" height="6"  rx="2" fill="#1a0a30" opacity="0.7"/>

  </g>

  <!-- ═══ LINKER TEXTBEREICH ═══ -->

  <!-- Japanisches Dekozeichen (背景) -->
  <text x="55" y="400" font-family="serif" font-size="260" fill="#e879f9"
        opacity="0.05" font-weight="bold">本</text>

  <!-- Badge / Chip oben -->
  <rect x="52" y="68" width="200" height="32" rx="16" fill="#7c3aed" opacity="0.85"/>
  <text x="152" y="89" font-family="'Segoe UI', Arial, sans-serif" font-size="13"
        fill="#e9d5ff" text-anchor="middle" font-weight="600" letter-spacing="2">MANGA SAMMLUNG</text>

  <!-- Haupttitel -->
  <text x="52" y="175" font-family="'Segoe UI', Georgia, serif" font-size="72"
        fill="white" font-weight="900" filter="url(#textglow)" opacity="0.97">Manga</text>
  <text x="52" y="262" font-family="'Segoe UI', Georgia, serif" font-size="72"
        fill="url(#titleGrad)" font-weight="900">
    <defs>
      <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#f472b6"/>
        <stop offset="50%"  stop-color="#c084fc"/>
        <stop offset="100%" stop-color="#818cf8"/>
      </linearGradient>
    </defs>
    Sammlung
  </text>

  <!-- Tagline -->
  <text x="54" y="313" font-family="'Segoe UI', Arial, sans-serif" font-size="21"
        fill="#e9d5ff" opacity="0.85" font-weight="400">Deine persönliche Manga-Bibliothek</text>

  <!-- Feature-Punkte -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#d8b4fe" opacity="0.9">
    <!-- ISBN-Scanner -->
    <rect x="52" y="340" width="26" height="26" rx="13" fill="#7c3aed" opacity="0.7"/>
    <text x="65" y="358" text-anchor="middle" fill="white" font-size="14">📷</text>
    <text x="88" y="358" fill="#e9d5ff">ISBN-Scanner</text>

    <!-- Offline -->
    <rect x="52" y="374" width="26" height="26" rx="13" fill="#7c3aed" opacity="0.7"/>
    <text x="65" y="392" text-anchor="middle" fill="white" font-size="14">📱</text>
    <text x="88" y="392" fill="#e9d5ff">Offline verfügbar</text>

    <!-- Statistiken -->
    <rect x="230" y="340" width="26" height="26" rx="13" fill="#7c3aed" opacity="0.7"/>
    <text x="243" y="358" text-anchor="middle" fill="white" font-size="14">📊</text>
    <text x="266" y="358" fill="#e9d5ff">Statistiken</text>

    <!-- Kostenlos -->
    <rect x="230" y="374" width="26" height="26" rx="13" fill="#7c3aed" opacity="0.7"/>
    <text x="243" y="392" text-anchor="middle" fill="white" font-size="14">✨</text>
    <text x="266" y="392" fill="#e9d5ff">Kostenlos</text>
  </g>

  <!-- Trennlinie zwischen Text und Regal -->
  <line x1="575" y1="60" x2="575" y2="440" stroke="#c026d3" stroke-width="1" opacity="0.25"/>

  <!-- Untere Abschlussleiste -->
  <rect x="0" y="468" width="1024" height="32" fill="#000" opacity="0.25"/>
  <text x="512" y="488" font-family="'Segoe UI', Arial, sans-serif" font-size="13"
        fill="#d8b4fe" text-anchor="middle" opacity="0.7" letter-spacing="3">
    Von der Excel-Liste zur smarten App
  </text>
</svg>
